<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFE4EC">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Một món quà nhỏ nhân kỷ niệm 1 năm yêu nhau.">
  <title>Gửi Kim 💗 · 1 năm yêu nhau</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐱%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ===== SPRITE SVG DÙNG CHUNG ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Mèo Hello Kitty (Không miệng, nơ đỏ, mũi vàng) -->
    <symbol id="i-cat" viewBox="0 0 120 108">
      <!-- Tai trái (góc nhìn người xem) -->
      <path d="M15 40 L20 5 L45 25 Z" fill="#FFF" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <!-- Tai phải -->
      <path d="M105 40 L100 5 L75 25 Z" fill="#FFF" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
      <!-- Khuôn mặt (Vẽ đè lên tai để che nét đứt) -->
      <ellipse cx="60" cy="60" rx="55" ry="42" fill="#FFF" stroke="#111" stroke-width="3"/>
      <!-- Mắt -->
      <ellipse cx="35" cy="65" rx="4.5" ry="7" fill="#111"/>
      <ellipse cx="85" cy="65" rx="4.5" ry="7" fill="#111"/>
      <!-- Mũi vàng -->
      <ellipse cx="60" cy="72" rx="6" ry="4" fill="#FFD700" stroke="#111" stroke-width="2"/>
      <!-- Râu bên trái -->
      <path d="M5 55 L22 60 M2 65 L20 65 M5 75 L22 70" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <!-- Râu bên phải -->
      <path d="M115 55 L98 60 M118 65 L100 65 M115 75 L98 70" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <!-- Nơ đỏ (Bên tai phải của Kitty, tức là bên trái người xem) -->
      <path d="M45 15 C55 5, 60 25, 45 30 C30 25, 35 5, 45 15 Z" fill="#FF0000" stroke="#111" stroke-width="2"/>
      <path d="M25 15 C15 5, 10 25, 25 30 C40 25, 35 5, 25 15 Z" fill="#FF0000" stroke="#111" stroke-width="2"/>
      <circle cx="35" cy="22" r="6" fill="#FF0000" stroke="#111" stroke-width="2"/>
    </symbol>

    <!-- Bao thư hoa đào hồng và dấu sáp đỏ -->
    <symbol id="i-envelope" viewBox="0 0 160 120">
      <!-- Khung bìa thư sau -->
      <rect x="10" y="25" width="140" height="85" fill="#FFE4EC" stroke="#8C2F5A" stroke-width="2" rx="4"/>
      <!-- Cánh gấp 2 bên -->
      <path d="M10 25 L70 70 L10 110 Z" fill="#FFF6EE" stroke="#8C2F5A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M150 25 L90 70 L150 110 Z" fill="#FFF6EE" stroke="#8C2F5A" stroke-width="2" stroke-linejoin="round"/>
      <!-- Cánh gấp dưới -->
      <path d="M10 110 L80 70 L150 110 Z" fill="#FFC2D6" stroke="#8C2F5A" stroke-width="2" stroke-linejoin="round"/>
      <!-- Nhành hoa trang trí -->
      <path d="M15 100 Q 40 40 80 20" fill="none" stroke="#5b6647" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M145 100 Q 120 40 80 20" fill="none" stroke="#5b6647" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="35" cy="55" r="4.5" fill="#FF8FB1" stroke="#8C2F5A" stroke-width="1"/>
      <circle cx="125" cy="55" r="4.5" fill="#FF8FB1" stroke="#8C2F5A" stroke-width="1"/>
      <circle cx="55" cy="30" r="6" fill="#FF8FB1" stroke="#8C2F5A" stroke-width="1"/>
      <circle cx="105" cy="30" r="6" fill="#FF8FB1" stroke="#8C2F5A" stroke-width="1"/>
      <circle cx="80" cy="15" r="7" fill="#FF8FB1" stroke="#8C2F5A" stroke-width="1"/>
      <!-- Cánh gấp trên -->
      <path d="M10 25 L80 80 L150 25 Z" fill="#FFC2D6" stroke="#8C2F5A" stroke-width="2" stroke-linejoin="round"/>
      <!-- Dấu sáp đỏ -->
      <circle cx="80" cy="75" r="14" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
      <!-- Họa tiết nhỏ trên dấu sáp -->
      <path d="M74 72 Q80 82 86 72" fill="none" stroke="#FFCDD2" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M80 66 L80 80" fill="none" stroke="#FFCDD2" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>

    <!-- Chân mèo -->
    <symbol id="i-paw" viewBox="0 0 64 64">
      <ellipse cx="12" cy="30" rx="6.5" ry="8.5" fill="currentColor" transform="rotate(-20 12 30)"/>
      <ellipse cx="25" cy="16" rx="6.5" ry="9" fill="currentColor" transform="rotate(-8 25 16)"/>
      <ellipse cx="39" cy="16" rx="6.5" ry="9" fill="currentColor" transform="rotate(8 39 16)"/>
      <ellipse cx="52" cy="30" rx="6.5" ry="8.5" fill="currentColor" transform="rotate(20 52 30)"/>
      <path fill="currentColor" d="M32 31c-9 0-17 8-17 16 0 5 4 8.5 9 8.5 3.5 0 5.5-1.8 8-1.8s4.5 1.8 8 1.8c5 0 9-3.5 9-8.5 0-8-8-16-17-16z"/>
    </symbol>

    <!-- Trái tim -->
    <symbol id="i-heart" viewBox="0 0 32 30">
      <path fill="currentColor" d="M16 28.5C5 20 0 14.5 0 8.5A8 8 0 0 1 16 6a8 8 0 0 1 16 2.5C32 14.5 27 20 16 28.5z"/>
    </symbol>
  </defs>
</svg>

<div id="app" class="app">
  <!-- NỀN WATERCOLOR & HẠT LƠ LỬNG -->
  <div class="bg" id="bg-canvas" aria-hidden="true">
    <span class="bg-blob bg-blob--pink"></span>
    <span class="bg-blob bg-blob--blue"></span>
    <span class="bg-blob bg-blob--cream"></span>
    <!-- Các hạt (cánh hoa, bong bóng) sẽ được JS tự động thêm vào đây -->
  </div>

  <!-- Nút nhạc -->
  <button id="btn-music" class="ctrl-music" type="button" aria-label="Nhạc nền" aria-pressed="false">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3" fill="currentColor"/>
      <circle cx="18" cy="16" r="3" fill="currentColor"/>
      <line class="ico-slash" x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="stage" class="stage" role="main">
    <!-- CẢNH 0: Mở đầu -->
    <section class="scene is-active" id="scene-0" data-scene="0" aria-label="Mở đầu">
      <div class="scene-inner">
        <p class="eyebrow">Gửi <span data-bind="herName">Kim</span> 🐾</p>
        <h1 class="title script" id="s0-title">Một năm yêu nhau</h1>
        
        <button id="s0-start" class="envelope-btn" type="button" aria-label="Chạm vào bao thư để mở quà">
          <div class="envelope-wrapper">
            <!-- Mèo Hello Kitty núp sau bìa thư -->
            <svg class="cat-svg hello-kitty" aria-hidden="true"><use href="#i-cat"/></svg>
            <!-- Bao thư -->
            <svg class="env-svg" aria-hidden="true"><use href="#i-envelope"/></svg>
          </div>
        </button>
        <p class="hint">Chạm vào bao thư để mở quà nhé</p>
      </div>
      <button class="btn-skip" type="button" data-action="next" aria-label="Bỏ qua cảnh này">Bỏ qua ›</button>
    </section>

    <!-- Các cảnh placeholder -->
    <section class="scene" id="scene-1" inert aria-hidden="true"><div class="scene-inner"><p>Scene 1 Placeholder</p><button class="btn-skip" data-action="next">Bỏ qua ›</button></div></section>
    <section class="scene" id="scene-2" inert aria-hidden="true"><div class="scene-inner"><p>Scene 2 Placeholder</p><button class="btn-skip" data-action="next">Bỏ qua ›</button></div></section>
    <section class="scene" id="scene-3" inert aria-hidden="true"><div class="scene-inner"><p>Scene 3 Placeholder</p><button class="btn-skip" data-action="next">Bỏ qua ›</button></div></section>
    <section class="scene" id="scene-4" inert aria-hidden="true"><div class="scene-inner"><p>Scene 4 Placeholder</p><button class="btn-skip" data-action="next">Bỏ qua ›</button></div></section>
    <section class="scene" id="scene-5" inert aria-hidden="true"><div class="scene-inner"><p>Scene 5 Placeholder</p><button class="btn-skip" data-action="next">Bỏ qua ›</button></div></section>
    <section class="scene" id="scene-6" inert aria-hidden="true"><div class="scene-inner"><p>Scene 6 Placeholder</p><button class="btn-skip" data-action="restart">Quay lại</button></div></section>
  </div>

  <div id="transition" class="transition" aria-hidden="true">
    <span class="transition-paw"><svg class="ico" focusable="false"><use href="#i-paw"/></svg></span>
  </div>
  <audio id="audio-music" preload="none" loop></audio>
  <audio id="audio-voice" preload="none"></audio>
</div>
<script src="script.js"></script>
</body>
</html>
